<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#31190d" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f17f34" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg1)" />
  <circle cx="400" cy="180" r="280" fill="url(#glow1)" />

  <!-- Sacred Geometric Lines -->
  <g stroke="#f59e0b" stroke-opacity="0.15" stroke-width="1" fill="none">
    <circle cx="400" cy="170" r="120" />
    <circle cx="400" cy="170" r="140" stroke-dasharray="4,6" />
    <circle cx="400" cy="170" r="80" />
    <line x1="260" y1="170" x2="540" y2="170" />
    <line x1="400" y1="30" x2="400" y2="310" />
  </g>

  <!-- Golden Cross Symbol -->
  <g fill="url(#goldText)" filter="drop-shadow(0px 4px 12px rgba(241,127,52,0.6))">
    <!-- Vertical beam -->
    <rect x="393" y="90" width="14" height="150" rx="3" />
    <!-- Horizontal beam -->
    <rect x="345" y="130" width="110" height="14" rx="3" />
    <!-- Cross center halo -->
    <circle cx="400" cy="137" r="12" fill="none" stroke="#fef3c7" stroke-width="2" />
  </g>

  <!-- Top Pill -->
  <g transform="translate(400, 260)">
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#0f172a" fill-opacity="0.75" stroke="#f17f34" stroke-width="1.5" />
    <text text-anchor="middle" y="4" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" font-weight="bold" fill="#fde047" letter-spacing="2">
      SAM DISCIPLESHIP SERIES
    </text>
  </g>

  <!-- Main Course Title -->
  <text x="400" y="320" text-anchor="middle" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="34" font-weight="bold" fill="#ffffff" letter-spacing="0.5">
    MÔN ĐỒ HÓA NỀN TẢNG
  </text>
  <text x="400" y="352" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="600" fill="#fed7aa" letter-spacing="1">
    Discipleship 101: Solid Foundation in Christ
  </text>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(400, 410)" opacity="0.85">
    <text text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#cbd5e1" letter-spacing="1">
      Spiritual Advance Ministry • saministry.org
    </text>
  </g>

  <!-- Corner Ornaments -->
  <path d="M 20,40 L 20,20 L 40,20" stroke="#f17f34" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 780,40 L 780,20 L 760,20" stroke="#f17f34" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 20,410 L 20,430 L 40,430" stroke="#f17f34" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 780,410 L 780,430 L 760,430" stroke="#f17f34" stroke-width="2" fill="none" opacity="0.6" />
</svg>
