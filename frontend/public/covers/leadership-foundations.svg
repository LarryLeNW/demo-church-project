<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLeadership" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="45%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <radialGradient id="glowLead" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f17f34" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldLead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgLeadership)" />
  <circle cx="400" cy="170" r="270" fill="url(#glowLead)" />

  <!-- Sacred Geometric Circle of Community & Shepherd Fellowship -->
  <g stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5" fill="none">
    <circle cx="400" cy="160" r="110" />
    <circle cx="400" cy="160" r="130" stroke-dasharray="5,6" />
    <circle cx="400" cy="160" r="85" />
    <!-- 8 Shepherd/Disciple Stars around the circle -->
    <circle cx="400" cy="50" r="4" fill="#fbbf24" stroke="none" />
    <circle cx="510" cy="160" r="4" fill="#fbbf24" stroke="none" />
    <circle cx="400" cy="270" r="4" fill="#fbbf24" stroke="none" />
    <circle cx="290" cy="160" r="4" fill="#fbbf24" stroke="none" />
    <circle cx="478" cy="82" r="3" fill="#f59e0b" stroke="none" />
    <circle cx="478" cy="238" r="3" fill="#f59e0b" stroke="none" />
    <circle cx="322" cy="82" r="3" fill="#f59e0b" stroke="none" />
    <circle cx="322" cy="238" r="3" fill="#f59e0b" stroke="none" />
  </g>

  <!-- Shepherd's Staff and Cross Symbol -->
  <g fill="none" stroke="url(#goldLead)" stroke-linecap="round" stroke-linejoin="round" filter="drop-shadow(0px 4px 12px rgba(241,127,52,0.65))">
    <!-- Shepherd Staff crook -->
    <path d="M 370 170 C 370 115 415 115 415 138 C 415 155 398 165 385 175 L 385 240" stroke-width="8" />
    <!-- Cross vertical beam behind crook -->
    <line x1="418" y1="95" x2="418" y2="235" stroke-width="6" />
    <!-- Cross horizontal beam -->
    <line x1="392" y1="130" x2="444" y2="130" stroke-width="6" />
  </g>

  <!-- Top Pill -->
  <g transform="translate(400, 260)">
    <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#f17f34" stroke-width="1.5" />
    <text text-anchor="middle" y="4" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" font-weight="bold" fill="#fde047" letter-spacing="2">
      SAM LEADERSHIP ACADEMY
    </text>
  </g>

  <!-- Main Course Title -->
  <text x="400" y="325" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Be Vietnam Pro', serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1">
    LÃNH ĐẠO NHÓM NHỎ &amp; MỤC VỤ
  </text>

  <!-- Subtitle -->
  <text x="400" y="360" text-anchor="middle" font-family="'Be Vietnam Pro', Inter, sans-serif" font-size="14" font-weight="500" fill="#fdba74" letter-spacing="1.5">
    Small Group Leadership &amp; Pastoral Care • 6 Tuần (12 Tiết)
  </text>

  <!-- Scripture Quote -->
  <text x="400" y="405" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#e2e8f0" fill-opacity="0.85">
    &quot;Hãy chăn bầy của Đức Chúa Trời đã giao phó cho anh em... làm gương tốt cho cả bầy&quot; — 1 Phi-e-rơ 5:2-3
  </text>

  <!-- Bottom Accent Stripe SAM Brand -->
  <rect x="0" y="444" width="800" height="6" fill="#f17f34" />
</svg>