<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="40%" stop-color="#143e33" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#f17f34" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)" />
  <circle cx="400" cy="170" r="260" fill="url(#glow2)" />

  <!-- Sacred Geometric Circle Grid -->
  <g stroke="#34d399" stroke-opacity="0.15" stroke-width="1" fill="none">
    <circle cx="400" cy="160" r="110" />
    <circle cx="400" cy="160" r="130" stroke-dasharray="3,5" />
    <circle cx="400" cy="160" r="75" />
  </g>

  <!-- Stylized Open Bible Icon -->
  <g transform="translate(400, 160)" filter="drop-shadow(0px 6px 14px rgba(0,0,0,0.5))">
    <!-- Left Page -->
    <path d="M 0,20 Q -40,-10 -90,5 L -90,-60 Q -40,-75 0,-45 Z" fill="#fcfbf8" stroke="#d4c8b0" stroke-width="2" />
    <!-- Right Page -->
    <path d="M 0,20 Q 40,-10 90,5 L 90,-60 Q 40,-75 0,-45 Z" fill="#fcfbf8" stroke="#d4c8b0" stroke-width="2" />
    <!-- Center Spine & Ribbon Bookmark -->
    <line x1="0" y1="-45" x2="0" y2="25" stroke="#78350f" stroke-width="3" />
    <path d="M 0,-45 L 8,45 L 0,38 L -8,45 Z" fill="#f17f34" />
    <!-- Scripture Lines on Pages -->
    <g stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6">
      <line x1="-75" y1="-40" x2="-20" y2="-32" />
      <line x1="-75" y1="-25" x2="-15" y2="-17" />
      <line x1="-75" y1="-10" x2="-25" y2="-2" />
      <line x1="-75" y1="5" x2="-35" y2="10" />

      <line x1="20" y1="-32" x2="75" y2="-40" />
      <line x1="15" y1="-17" x2="75" y2="-25" />
      <line x1="25" y1="-2" x2="75" y2="-10" />
      <line x1="35" y1="10" x2="75" y2="5" />
    </g>
    <!-- Little Gold Cross on Book -->
    <text x="0" y="-12" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" fill="#b45309">†</text>
  </g>

  <!-- Top Pill -->
  <g transform="translate(400, 260)">
    <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#0f172a" fill-opacity="0.8" stroke="#34d399" stroke-width="1.5" />
    <text text-anchor="middle" y="4" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11" font-weight="bold" fill="#6ee7b7" letter-spacing="2">
      DAILY SCRIPTURE HABIT
    </text>
  </g>

  <!-- Main Course Title -->
  <text x="400" y="320" text-anchor="middle" font-family="'Playfair Display', 'Cinzel', Georgia, serif" font-size="34" font-weight="bold" fill="#ffffff" letter-spacing="0.5">
    ĐỌC KINH THÁNH HẰNG NGÀY
  </text>
  <text x="400" y="352" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="14" font-weight="600" fill="#a7f3d0" letter-spacing="1">
    Living Word, Prayer &amp; Spiritual Disciplines
  </text>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(400, 410)" opacity="0.85">
    <text text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#cbd5e1" letter-spacing="1">
      Spiritual Advance Ministry • saministry.org
    </text>
  </g>

  <!-- Corner Ornaments -->
  <path d="M 20,40 L 20,20 L 40,20" stroke="#34d399" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 780,40 L 780,20 L 760,20" stroke="#34d399" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 20,410 L 20,430 L 40,430" stroke="#34d399" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 780,410 L 780,430 L 760,430" stroke="#34d399" stroke-width="2" fill="none" opacity="0.6" />
</svg>
